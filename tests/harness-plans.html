<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FinTrack Plan Runtime Harness</title>
</head>
<body>
  <pre id="OUT">running…</pre>
  <script>
    // Minimal stubs used by plans.js
    function showToast() {}
    window.showToast = showToast;
  </script>
  <script src="../js/currency-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/currency.js"></script>
  <script src="../js/plans.js"></script>
  <script>
    (function () {
      const results = { cases: [], errors: [] };
      const assert = (cond, name, detail) => {
        results.cases.push({ name, pass: Boolean(cond), detail: detail || '' });
      };

      try {
        localStorage.clear();

        // Seed user on Free with $25
        const userId = 'u-test-1';
        const users = [{
          id: userId,
          name: 'Test User',
          email: 'test@fintrack.demo',
          password: 'pass123',
          plan: 'free',
          demoWallet: 25,
        }];
        localStorage.setItem('fintrack_users', JSON.stringify(users));
        localStorage.setItem('fintrack_session', userId);
        localStorage.setItem('fintrack_data_' + userId, JSON.stringify({
          profile: { onboarded: true },
          transactions: [],
          budgets: {},
          goals: [],
          subscriptions: [],
          netWorth: { assets: [], liabilities: [], history: [] },
          alertReads: {},
          notices: [],
        }));

        assert(getUserPlan() === 'free', 'start_free');
        assert(getDemoWallet() === 25, 'start_wallet_25');
        assert(hasPlanAtLeast('free') === true, 'rank_free_ok');
        assert(hasPlanAtLeast('pro') === false, 'rank_free_no_pro');
        assert(hasPlanAtLeast('premium') === false, 'rank_free_no_premium');

        // Top-up
        let top = addDemoFunds(10);
        assert(top.ok && top.balance === 35, 'topup_10', JSON.stringify(top));

        // Cannot buy premium with insufficient funds after spending to low
        updateCurrentUser({ demoWallet: 5 });
        let failPrem = purchasePlan('premium');
        assert(!failPrem.ok && failPrem.needFunds, 'premium_need_funds');

        // Buy Pro for $6 from $35
        updateCurrentUser({ demoWallet: 35, plan: 'free', planStartedAt: null, planExpiresAt: null });
        let buyPro = purchasePlan('pro');
        assert(buyPro.ok && buyPro.plan === 'pro' && buyPro.charged === 6, 'buy_pro_ok', JSON.stringify(buyPro));
        assert(getUserPlan() === 'pro', 'plan_is_pro');
        assert(Math.abs(getDemoWallet() - 29) < 0.001, 'wallet_after_pro', String(getDemoWallet()));
        assert(hasPlanAtLeast('pro') === true, 'rank_pro_includes_pro');
        assert(hasPlanAtLeast('premium') === false, 'rank_pro_excludes_premium');
        assert(!!currentUser().planExpiresAt, 'pro_has_expiry');
        assert(getPlanDaysLeft() >= 29 && getPlanDaysLeft() <= 30, 'pro_days_left', String(getPlanDaysLeft()));

        // Duplicate purchase blocked
        let dup = purchasePlan('pro');
        assert(!dup.ok, 'dup_pro_blocked');

        // Upgrade to Premium for $12 from 29
        let buyPrem = purchasePlan('premium');
        assert(buyPrem.ok && buyPrem.plan === 'premium' && buyPrem.charged === 12, 'buy_premium_ok');
        assert(getUserPlan() === 'premium', 'plan_is_premium');
        assert(Math.abs(getDemoWallet() - 17) < 0.001, 'wallet_after_premium', String(getDemoWallet()));
        assert(hasPlanAtLeast('free') && hasPlanAtLeast('pro') && hasPlanAtLeast('premium'), 'premium_includes_all');

        // Downgrade to Pro (no charge)
        let downPro = switchPlan('pro');
        assert(downPro.ok && downPro.downgraded, 'downgrade_to_pro');
        assert(getUserPlan() === 'pro', 'after_down_pro');
        assert(getDemoWallet() === 17, 'downgrade_no_refund_charge');

        // Downgrade to Free
        let downFree = switchPlan('free');
        assert(downFree.ok, 'downgrade_to_free');
        assert(getUserPlan() === 'free', 'after_down_free');
        assert(!currentUser().planExpiresAt, 'free_clears_expiry');

        // Notices created
        const data = getData();
        assert(Array.isArray(data.notices) && data.notices.length >= 3, 'notices_recorded', String(data.notices.length));
        assert(data.notices.some((n) => /Premium|Pro|Free/i.test(n.title || '')), 'notice_titles');

        // Math helpers
        assert(goalProgress({ target: 200, saved: 50 }) === 25, 'goal_progress_25');
        assert(goalProgress({ target: 0, saved: 10 }) === 0, 'goal_progress_zero_target');
        assert(goalProgress({ target: 100, saved: 150 }) === 100, 'goal_progress_capped');
        assert(monthlySubCost({ amount: 120, cycle: 'yearly' }) === 10, 'sub_yearly');
        assert(monthlySubCost({ amount: 10, cycle: 'weekly' }) === 43, 'sub_weekly');
        assert(totalNetWorth({ assets: [{ value: 1000 }, { value: 500 }], liabilities: [{ value: 200 }] }) === 1300, 'networth_math');
        const moneyStr = String(typeof money === 'function' ? money(1234) : '');
        assert(/1234/.test(moneyStr.replace(/[^\d]/g, '')), 'money_format', moneyStr);

        // Currency preference
        assert(typeof getUserCurrency === 'function', 'getUserCurrency_fn');
        assert(typeof setUserCurrency === 'function', 'setUserCurrency_fn');
        assert(typeof formatMoney === 'function', 'formatMoney_fn');
        setUserCurrency('EUR');
        assert(getUserCurrency() === 'EUR', 'currency_set_eur');
        const eurStr = String(money(1234));
        assert(/€|EUR|1.?234/i.test(eurStr), 'money_eur_format', eurStr);
        setUserCurrency('USD');
        assert(getUserCurrency() === 'USD', 'currency_back_usd');
        assert(getData().profile.currency === 'USD', 'profile_currency_persisted');

        const txs = [
          { id: '1', type: 'income', amount: 1000, category: 'Salary', date: localDateStr() },
          { id: '2', type: 'expense', amount: 250, category: 'Food', date: localDateStr() },
          { id: '3', type: 'expense', amount: 50, category: 'Transport', date: localDateStr() },
        ];
        const m = monthKey();
        assert(sumByType(txs, 'income', m) === 1000, 'sum_income');
        assert(sumByType(txs, 'expense', m) === 300, 'sum_expense');
        assert(canonicalCategory('food') === 'Food', 'canonical_food');

        // Expiry auto-downgrade
        updateCurrentUser({
          plan: 'premium',
          demoWallet: 20,
          planStartedAt: new Date(Date.now() - 40 * 864e5).toISOString(),
          planExpiresAt: new Date(Date.now() - 864e5).toISOString(),
        });
        ensurePlanPeriod();
        assert(getUserPlan() === 'free', 'expired_to_free');

        // Free limits constants mirrored in app source (assert catalog prices)
        assert(PLAN_CATALOG.pro.price === 6, 'pro_price_6');
        assert(PLAN_CATALOG.premium.price === 12, 'premium_price_12');
        assert(DEMO_TOPUP_AMOUNT === 10, 'topup_10');
        assert(PLAN_PERIOD_DAYS === 30, 'period_30');

        /* ── Onboarding seed → dashboard KPI math (mirrors onboarding.js finish) ── */
        localStorage.clear();
        const seedUser = {
          id: 'u-seed-1',
          name: 'Seed User',
          email: 'seed@fintrack.demo',
          password: 'pass123',
          plan: 'free',
          demoWallet: 25,
        };
        localStorage.setItem('fintrack_users', JSON.stringify([seedUser]));
        localStorage.setItem('fintrack_session', seedUser.id);
        localStorage.setItem('fintrack_data_' + seedUser.id, JSON.stringify({
          profile: { onboarded: false, currency: '', income: 0, categories: [], moneyStyle: '', goalType: '' },
          transactions: [],
          budgets: {},
          goals: [],
          subscriptions: [],
          netWorth: { assets: [], liabilities: [], history: [] },
          alertReads: {},
          notices: [],
        }));

        const answers = {
          currency: 'GBP',
          income: 5000,
          categories: ['Food', 'Rent', 'Transport'],
          catAmounts: { Food: 400, Rent: 1500, Transport: 200 },
          goalType: 'Emergency Fund',
          goalTarget: 10000,
          goalSaved: 1500,
          moneyStyle: 'saver',
        };
        const today = localDateStr();
        const seeded = getData();
        seeded.profile = {
          onboarded: true,
          currency: answers.currency,
          income: answers.income,
          categories: answers.categories,
          moneyStyle: answers.moneyStyle,
          goalType: answers.goalType,
        };
        seeded.transactions.push({
          id: uid(), type: 'income', amount: answers.income, category: 'Salary', date: today, note: 'Monthly income',
        });
        answers.categories.forEach((cat) => {
          const amt = answers.catAmounts[cat];
          seeded.transactions.push({
            id: uid(), type: 'expense', amount: amt, category: cat, date: today, note: 'Typical monthly spend',
          });
          seeded.budgets[cat] = Math.round(amt * 1.15);
        });
        seeded.goals.push(normalizeGoal({
          id: uid(),
          name: answers.goalType,
          category: inferGoalCategory(answers.goalType),
          target: answers.goalTarget,
          saved: answers.goalSaved,
          deadline: '',
          priority: 'high',
          monthlyContribution: 0,
          note: 'Created during onboarding',
          history: [{ id: uid(), date: today, amount: answers.goalSaved, type: 'deposit', note: 'Initial balance' }],
        }));
        saveData(seeded);

        const after = getData();
        const mKey = monthKey();
        const monthIncome = sumByType(after.transactions, 'income', mKey);
        const monthExpense = sumByType(after.transactions, 'expense', mKey);
        const balance = sumByType(after.transactions, 'income') - sumByType(after.transactions, 'expense');
        const savingsRate = monthIncome > 0 ? Math.round(((monthIncome - monthExpense) / monthIncome) * 100) : 0;

        assert(after.profile.onboarded === true, 'seed_onboarded');
        assert(after.profile.currency === 'GBP', 'seed_currency_gbp');
        assert(after.profile.income === 5000, 'seed_profile_income');
        assert(monthIncome === 5000, 'dash_kpi_income_5000');
        assert(monthExpense === 2100, 'dash_kpi_expenses_2100');
        assert(balance === 2900, 'dash_kpi_balance_2900');
        assert(savingsRate === 58, 'dash_kpi_savings_58');
        assert(after.budgets.Food === 460, 'seed_budget_food_115pct');
        assert(after.budgets.Rent === 1725, 'seed_budget_rent_115pct');
        assert(after.budgets.Transport === 230, 'seed_budget_transport_115pct');
        assert(after.goals.length === 1 && after.goals[0].target === 10000, 'seed_goal_target');
        assert(goalProgress(after.goals[0]) === 15, 'seed_goal_progress_15');

        setUserCurrency('GBP');
        const gbpIncome = String(money(monthIncome));
        assert(/£|GBP|5.?000/i.test(gbpIncome), 'dash_income_gbp_format', gbpIncome);

        /* ── Form writes reflect on dashboard math ── */
        after.transactions.unshift(normalizeTransaction({
          id: uid(), type: 'expense', amount: 50, category: 'Food', date: today, note: 'Lunch',
        }));
        after.budgets.Food = 500;
        after.goals[0].saved = 2000;
        after.goals[0].history.push({ id: uid(), date: today, amount: 500, type: 'deposit', note: 'Extra' });
        saveData(after);

        const updated = getData();
        assert(sumByType(updated.transactions, 'expense', mKey) === 2150, 'form_tx_expense_updates_kpi');
        assert(updated.budgets.Food === 500, 'form_budget_saved');
        assert(goalProgress(updated.goals[0]) === 20, 'form_goal_fund_updates_progress');

        /* ── Search index covers seeded + form data ── */
        function buildSearchIndexLite(data) {
          const items = [];
          data.transactions.forEach((t) => {
            items.push({ title: t.category, keywords: [t.category, t.note, t.type], url: 'transactions.html' });
          });
          data.goals.forEach((g) => {
            items.push({ title: g.name, keywords: [g.name, 'goal'], url: 'goals.html' });
          });
          Object.keys(data.budgets).forEach((category) => {
            items.push({ title: category, keywords: [category, 'budget'], url: 'budgets.html' });
          });
          return items;
        }
        const index = buildSearchIndexLite(updated);
        const q = 'food';
        const hits = index.filter((item) => {
          const hay = [item.title].concat(item.keywords || []).join(' ').toLowerCase();
          return hay.includes(q);
        });
        assert(hits.length >= 2, 'search_hits_food', String(hits.length));
        assert(hits.some((h) => h.url === 'transactions.html'), 'search_tx_url');
        assert(hits.some((h) => h.url === 'budgets.html'), 'search_budget_url');
        assert(index.some((h) => /emergency/i.test(h.title)), 'search_indexes_goal');
      } catch (e) {
        results.errors.push(String(e && e.stack || e));
      }

      document.getElementById('OUT').textContent = JSON.stringify(results);
    })();
  </script>
</body>
</html>
