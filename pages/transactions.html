<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transactions — FinTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="../css/styles.css?v=2"/>
  <link rel="stylesheet" href="../css/dashboard.css?v=16"/>
  <link rel="stylesheet" href="../css/currency.css?v=2"/>
</head>
<body>
  <div class="app">

    <aside class="sidebar" id="appSidebar" data-page="transactions"></aside>

    <main class="main">
      <div class="topbar">
        <div class="greeting">
          <h1>Transactions</h1>
          <p>Record income and expenses to keep every chart up to date.</p>
        </div>
        <button class="btn-gold" onclick="exportCSV()"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
      </div>

      <!-- KPIs -->
      <section class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-top"><span class="kpi-label">Total Income</span><span class="kpi-icon" style="background:rgba(0,230,118,0.1);color:#00E676;"><i class="fa-solid fa-arrow-down"></i></span></div>
          <div class="kpi-value" id="kpiIncome">$0</div>
          <div class="kpi-sub">All time</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><span class="kpi-label">Total Expenses</span><span class="kpi-icon" style="background:rgba(255,82,82,0.1);color:#FF5252;"><i class="fa-solid fa-arrow-up"></i></span></div>
          <div class="kpi-value" id="kpiExpenses">$0</div>
          <div class="kpi-sub">All time</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><span class="kpi-label">Balance</span><span class="kpi-icon" style="background:rgba(212,175,55,0.12);color:#D4AF37;"><i class="fa-solid fa-sack-dollar"></i></span></div>
          <div class="kpi-value" id="kpiBalance">$0</div>
          <div class="kpi-sub">Income − Expenses</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><span class="kpi-label">Entries</span><span class="kpi-icon" style="background:rgba(110,168,254,0.12);color:#6EA8FE;"><i class="fa-solid fa-receipt"></i></span></div>
          <div class="kpi-value" id="kpiCount">0</div>
          <div class="kpi-sub">Total recorded</div>
        </div>
      </section>

      <!-- ADD + LIST -->
      <section class="panel">
        <h3>Add a transaction</h3>
        <p class="panel-sub">Choose a type, enter a category and amount.</p>

        <form class="form-row" onsubmit="addTransaction(event)" novalidate>
          <select id="addType" onchange="syncCategoryOptions()">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
          <select id="addCategory"></select>
          <input type="number" id="addAmount" placeholder="Amount" min="0" step="0.01"/>
          <input type="date" id="addDate"/>
          <input type="text" id="addNote" placeholder="Note (optional)"/>
          <button type="submit"><i class="fa-solid fa-plus"></i> Add</button>
        </form>
        <p class="form-error" id="txFormError"></p>

        <div class="filters">
          <button class="filter-pill active" data-filter="all" onclick="setFilter(this)">All</button>
          <button class="filter-pill" data-filter="income" onclick="setFilter(this)">Income</button>
          <button class="filter-pill" data-filter="expense" onclick="setFilter(this)">Expense</button>
        </div>

        <div class="tx-list" id="txList"></div>
        <p class="empty-note" id="txEmpty" style="display:none;">No transactions to show.</p>
      </section>
    </main>
  </div>

  <script src="../js/currency-data.js?v=1"></script>
  <script src="../js/storage.js?v=14"></script>
  <script src="../js/currency.js?v=1"></script>
  <script src="../js/currency-select.js?v=1"></script>
  <script src="../js/ui.js?v=14"></script>
  <script src="../js/loader.js?v=8"></script>
  <script src="../js/auth.js?v=7"></script>
  <script src="../js/app-nav.js?v=11"></script>
  <script src="../js/transactions.js?v=9"></script>
</body>
</html>
